<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>URL Shortener</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff;min-height:100vh;display:grid;place-items:center;padding:20px}
    .card{width:min(680px,100%);background:#1e293b;border:1px solid #334155;border-radius:20px;padding:30px;box-shadow:0 20px 60px #0006}
    h1{margin:0 0 8px;font-size:34px}.sub{color:#94a3b8;margin:0 0 28px}
    form{display:flex;gap:10px}@media(max-width:560px){form{flex-direction:column}}
    input{flex:1;padding:15px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:16px;outline:none}
    button{padding:15px 22px;border:0;border-radius:10px;background:#6366f1;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
    button:hover{background:#4f46e5}.result{margin-top:22px;padding:18px;border-radius:12px;background:#0f172a;display:none}
    .result a{color:#818cf8;word-break:break-all}.row{display:flex;gap:10px;align-items:center;margin-top:10px}
    .copy{padding:10px 14px}.msg{margin-top:16px;color:#fca5a5}
    footer{margin-top:25px;color:#64748b;font-size:13px;text-align:center}
  </style>
</head>
<body>
<main class="card">
  <h1>🔗 URL Shortener</h1>
  <p class="sub">Convert long URLs into short, shareable links.</p>
  <form id="form">
    <input id="url" type="url" placeholder="https://example.com/very-long-url" required>
    <button id="btn">Shorten URL</button>
  </form>
  <div id="msg" class="msg"></div>
  <div id="result" class="result">
    <strong>Your short URL</strong>
    <div class="row"><a id="short" target="_blank"></a><button class="copy" id="copy">Copy</button></div>
  </div>
  <footer>Built with Node.js + Vercel Functions</footer>
</main>
<script>
const form=document.getElementById("form"),url=document.getElementById("url"),btn=document.getElementById("btn");
const result=document.getElementById("result"),short=document.getElementById("short"),msg=document.getElementById("msg");
form.addEventListener("submit",async e=>{
 e.preventDefault(); msg.textContent=""; result.style.display="none"; btn.disabled=true; btn.textContent="Creating...";
 try{
  const r=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:url.value})});
  const d=await r.json(); if(!r.ok) throw new Error(d.error||"Something went wrong");
  short.href=d.shortUrl; short.textContent=d.shortUrl; result.style.display="block";
 }catch(err){msg.textContent=err.message}
 finally{btn.disabled=false;btn.textContent="Shorten URL"}
});
document.getElementById("copy").onclick=async()=>{
 await navigator.clipboard.writeText(short.textContent);
 document.getElementById("copy").textContent="Copied!";
 setTimeout(()=>document.getElementById("copy").textContent="Copy",1200);
};
</script>
</body>
</html>
